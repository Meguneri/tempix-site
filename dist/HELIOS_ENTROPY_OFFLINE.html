 for(let k=0;k<kinds.length;k++){

 for(const q of s.bullets){const speed=Math.hypot(q.vx,q.vy),a=Math.atan2(q.vy,q.vx);c.save();c.translate(q.x,q.y);c.rotate(a);if(E.opts.quality==='high')E.glow(c,0,0,q.enemy?25:19,q.color,.28);c.strokeStyle=q.color+'77';c.lineWidth=q.r*1.7;c.beginPath();c.moveTo(-Math.min(37,speed*.025),0);c.lineTo(0,0);c.stroke();c.fillStyle=q.color;c.beginPath();c.ellipse(0,0,q.r*1.4,q.r,0,0,6.28);c.fill();c.fillStyle=q.enemy?'#ffe9f0':'#f4fffa';c.beginPath();c.arc(0,0,q.r*.42,0,6.28);c.fill();c.restore()}
 E.fxDraw(c,dt);
 if(E.opts.quality==='high'){
  c.save();c.globalCompositeOperation='screen';for(const p of s.players)E.glow(c,p.x,p.y,220,E.colors[p.id],.055);
  const rr=E.random(r.seed+88);for(let j=0;j<25;j++){const x=70+rr()*(r.w-140),yy=70+rr()*(r.h-140),y=(yy+E.clock*(s.floor===3?-14:5)+r.h)%r.h;if(!E.onScreen(x,y))continue;c.fillStyle=b.color+(s.floor===2?'44':'55');c.beginPath();c.arc(x+Math.sin(E.clock*.3+j)*12,y,s.floor===2?1.4:1.1,0,6.28);c.fill()}
  // Soft shafts are decorative and never conceal projectiles.
  c.globalAlpha=.03;c.fillStyle=b.color;for(let j=0;j<3;j++){c.beginPath();c.moveTo(180+j*360,45);c.lineTo(230+j*360,45);c.lineTo(410+j*360,r.h*.7);c.lineTo(260+j*360,r.h*.7);c.fill()}c.restore();
 }
 const p=s.players[E.seat]||s.players[0],obj=!p.down?E.nearObject(p):null;if(obj&&!s.offer){const label=obj.type==='door'?E.kind[s.graph.rooms[obj.id].kind][0]:obj.type==='portal'?'Войти в переход':obj.type==='artifact'?'Выбрать модуль':obj.type==='shop'?'Открыть снабжение':'Взаимодействовать';c.fillStyle='#06121be8';E.round(c,p.x-105,p.y+42,210,31,7);c.fill();E.txt(c,(E.coarse?'◎':'E')+'  '+label,p.x,p.y+58,12,'#e5f8eb')}
 c.restore();let vg=c.createRadialGradient(v.w*.5,v.h*.5,Math.min(v.w,v.h)*.25,v.w*.5,v.h*.5,Math.max(v.w,v.h)*.68);vg.addColorStop(0,'transparent');vg.addColorStop(1,'#020710a0');c.fillStyle=vg;c.fillRect(0,0,v.w,v.h);
 if(s.surge>0){c.strokeStyle='#f7d69e66';c.lineWidth=6;c.strokeRect(3,3,v.w-6,v.h-6)}
};
E.mapDraw=(cv,large=false)=>{
 const s=E.S;if(!s)return;const rect=cv.getBoundingClientRect(),w=rect.width||150,h=rect.height||120,dpr=Math.min(devicePixelRatio||1,2);if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);const nodes=s.graph.rooms.filter(n=>n.seen||large&&n.visited),xs=nodes.map(n=>n.x),ys=nodes.map(n=>n.y),minX=Math.min(...xs)-.7,maxX=Math.max(...xs)+.7,minY=Math.min(...ys)-.7,maxY=Math.max(...ys)+.7,scale=Math.min((w-20)/(maxX-minX),(h-20)/(maxY-minY),large?90:34),ox=(w-(maxX+minX)*scale)/2,oy=(h-(maxY+minY)*scale)/2;
 cv._map={ox,oy,scale,nodes};c.lineWidth=large?5:3;c.strokeStyle='#4d718577';for(const n of nodes)for(const k of n.links){const q=s.graph.rooms[k];if(q.seen){c.beginPath();c.moveTo(ox+n.x*scale,oy+n.y*scale);c.lineTo(ox+q.x*scale,oy+q.y*scale);c.stroke()}}
 for(const n of nodes){let x=ox+n.x*scale,y=oy+n.y*scale,ww=scale*.68,hh=scale*.49;const current=n.id===s.room.id,color=current?'#87f9df':n.kind==='boss'?'#ffc18c':n.main?'#96b3bf':'#ceb2ff';c.fillStyle=current?'#285b61':n.cleared?'#263f4d':'#101e2c';E.round(c,x-ww/2,y-hh/2,ww,hh,3);c.fill();c.strokeStyle=color+(n.visited?'dd':'55');c.lineWidth=current?2:1;c.stroke();E.txt(c,E.kind[n.kind][1],x,y,large?19:10,color);if(large)E.txt(c,E.kind[n.kind][0],x,y+hh/2+13,10,color);}
};

</script><script>
'use strict';
E.btn=(a,label,cls='',v='',disabled=false)=>`<button data-a="${a}" data-v="${E.esc(v)}" class="${cls}" ${disabled?'disabled':''}>${label}</button>`;
E.title=()=>`<div class="shell"><div class="titlegrid"><section><div class="eyebrow">HELIOS / ROGUELIKE EDITION 03</div><h1 class="wordmark">ГЕЛИОС</h1><div class="subtitle">Э Н Т Р О П И Я</div><p class="lead">Станция меняется с каждым погружением.<br>Собери невозможное оружие. Пройди пять секторов.<br>На этот раз — только вперёд.</p><div class="row mt"><span class="tag">СЛУЧАЙНЫЕ КОМНАТЫ</span><span class="tag">1–2 ИГРОКА</span><span class="tag">БЕЗ РЕКЛАМЫ</span></div><div class="titlebuttons">${E.btn('setup','<strong>Одиночный забег</strong><span>Без напарника · аномалии · рискованные сделки</span>','primary','solo')}${E.btn('network','<strong>Вдвоём по сети</strong><span>Два телефона или компьютер + телефон</span>')}${E.btn('setup','<strong>Экспедиция с Ирис</strong><span>Один игрок и напарник под управлением ИИ</span>','ghost','companion')}${E.load('helios3-save',null)?.version===E.version?E.btn('continue','<strong>Продолжить сохранённый забег</strong><span>Прогресс хранится в этом браузере</span>','gold'):''}</div><div class="row mt">${E.btn('help','Как играть','small ghost')}${E.btn('settings','Настройки','small ghost')}${E.btn('fullscreen','⛶ Экран','small ghost')}</div><div class="legalnote">Офлайн — один HTML. Кооператив — через комплектный сервер на ПК в общей LAN / VPN. Режимы не используют платных сервисов.</div></section><aside class="orbital"><div class="eyebrow">ПРОТОКОЛ / ENTROPY</div><div class="bigcount">05 <small>секторов</small></div><p class="hint">Доки. Затопленный сад. Криохранилище.<br>Промышленное солнце. Нулевая орбита.</p><div class="feature mt"><span>Модули и синергии</span><b>36 / 06</b></div><div class="feature"><span>Классы / оружие</span><b>04 / 06</b></div><div class="feature"><span>Разные боссы</span><b>05</b></div><div class="feature"><span>Повторное прохождение</span><b>НОВЫЙ SEED</b></div><p class="hint mt">Боковой маршрут — твой выбор.<br>Переход на следующий уровень появляется в комнате босса.</p><div class="divider"></div><div class="row between hint"><span>Забеги: ${E.profile.runs}</span><span>Победы: ${E.profile.wins}</span></div></aside></div></div>`;
E.setupHTML=()=>{
 const online=E.mode==='online',i=E.seat,c=E.config,cl=E.classes[c.cls[i]];
 return `<div class="shell"><div class="panel"><div class="row between"><div><div class="eyebrow">${online?'СОВМЕСТНОЕ ПОГРУЖЕНИЕ':E.mode==='solo'?'ЭНТРОПИЯ / ОДИНОЧНЫЙ ЗАБЕГ':'ЭКСПЕДИЦИЯ / ИИ-НАПАРНИК'}</div><h2>Выбери свой контур</h2></div>${online?`<div><label>Код комнаты</label><div class="code">${E.net.code}</div></div>`:''}</div><div class="classcards">${Object.entries(E.classes).map(([id,k])=>E.btn('class',`<div class="classglyph">${k.glyph}</div><strong>${k.name}</strong><p>${k.desc}</p>`,'classcard '+(c.cls[i]===id?'chosen':''),id)).join('')}</div><div class="grid2 mt"><div><label>Оружие</label><select id="weapon">${Object.entries(E.weapons).map(([id,w])=>`<option value="${id}" ${id===c.weapon[i]?'selected':''}>${w.name}</option>`).join('')}</select></div><div><label>Уровень угрозы</label><select id="difficulty" ${online&&i?'disabled':''}>${['Исследователь','Ветеран','Кошмар'].map((t,j)=>`<option value="${j}" ${c.diff===j?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="grid2 mt"><div><label>Seed забега · пусто = случайный</label><input id="seed" maxlength="40" value="${E.esc(c.seed)}" placeholder="Например: ORBIT-7" ${online&&i?'disabled':''}></div><div class="banner"><b>${cl.name}</b> · ${cl.hp} HP / ${cl.shield} щита<br><span class="hint">${online?'У каждого своя камера. Дружественного огня нет.':E.mode==='solo'?'Смерть завершает забег. Сохранение — для продолжения, не отката.':'Ирис помогает в бою и может поднять раненого игрока.'}</span></div></div>${E.mode==='solo'?'<div class="banner mt">Начальный артефакт, дополнительные аномалии и сделки за здоровье. Сочетания модулей меняют поведение оружия, а не только цифры урона.</div>':''}${online?`<div class="grid2 mt">${c.names.map((name,j)=>`<div class="banner"><b>${j===i?'ВЫ · ':''}${E.esc(name)}</b><br>${E.classes[c.cls[j]].name} / ${E.weapons[c.weapon[j]].name}<br><span class="badge">${!E.net.connected[j]?'ОЖИДАЕМ ПОДКЛЮЧЕНИЕ':j===0?'ВЕДУЩИЙ':c.ready[j]?'ГОТОВ':'ВЫБИРАЕТ СНАРЯЖЕНИЕ'}</span></div>`).join('')}</div>`:''}<div class="row mt">${online&&i===1?E.btn('ready',c.ready[1]?'Отменить готовность':'Готов к погружению','primary'):E.btn('start','Начать погружение','primary','',online&&(!E.net.connected[1]||!c.ready[1]))}${!online?E.btn('daily','Seed дня','ghost'):''}${E.btn('title','В главное меню','ghost')}</div>${E.storageWarn?'<div class="banner warn mt">Браузер запретил постоянное сохранение. До закрытия страницы прогресс хранится в памяти.</div>':''}<p class="hint mt">Телефон: левый стик — движение, правый — прицел. Автоогонь включён. Компьютер: WASD, мышь, Пробел, Q, E, R.</p></div></div>`;
};
E.networkHTML=()=>`<div class="shell narrow"><div class="panel"><div class="eyebrow">LAN / VPN · ДВА УСТРОЙСТВА</div><h2>Вместе под линию связи</h2><p class="hint mt">Компьютер запускает server.py. Оба телефона открывают его адрес. Python нужен только на серверном компьютере.</p><div class="banner mt ${location.protocol==='file:'?'warn':''}">${location.protocol==='file:'?'Сейчас открыт офлайн-файл. Сначала открой адрес запущенного сервера.':'Адрес этой страницы: <b>'+E.esc(location.host)+'</b>. Сетевой режим работает только на комплектном сервере.'}</div><div class="grid2 mt"><div><label>Позывной</label><input id="netname" maxlength="24" value="${E.esc(E.profile.name||'Искатель')}"></div><div><label>Код комнаты</label><input id="netcode" maxlength="6" placeholder="ABC234" style="text-transform:uppercase"></div></div><div class="row mt">${E.btn('create','Создать комнату','primary','',location.protocol==='file:')}${E.btn('join','Присоединиться','gold','',location.protocol==='file:')}</div><div class="divider"></div><label>Адрес твоего сервера</label><div class="row"><input id="serveraddress" placeholder="http://192.168.1.10:8787" style="flex:1;min-width:180px">${E.btn('openserver','Открыть','ghost')}</div><p class="hint mt">Из разных домов нужна общая частная VPN. Один код комнаты без доступа к серверу не создаёт соединение. Не публикуйте порт 8787 в открытом интернете.</p><div class="row mt">${E.btn('title','Назад','ghost')}</div></div></div>`;
E.itemHTML=()=>{const s=E.S,o=s.offer,i=E.seat,p=s.players[i];return `<div class="shell"><div class="panel"><div class="eyebrow">СБОРКА / ВЫБЕРИ ОДИН МОДУЛЬ</div><h2>${E.esc(o.source)}</h2><p class="hint mt">${p.name} · модули складываются и взаимодействуют друг с другом.</p>${o.picked[i]?'<div class="banner mt">Модуль установлен. Ждём выбор напарника.</div>':`<div class="grid3 mt">${o.options[i].map(id=>{const item=E.item[id];return E.btn('item',`<span class="glyph">${item.icon}</span><strong>${item.name}</strong><span class="hint">${item.desc}</span><span class="tag">${({attack:'ОРУЖИЕ',element:'ЭФФЕКТ',wild:'АНОМАЛИЯ',defense:'ЗАЩИТА',utility:'СИСТЕМА'})[item.tag]} ${(p.mods[id]||0)?' · '+(p.mods[id]+1)+' УР.':''}</span>`,'choice',id)}).join('')}</div>`}<p class="hint mt">Бой приостановлен для обоих игроков. После выбора продолжится тот же забег.</p></div></div>`};
E.shopHTML=()=>{const s=E.S;return `<div class="shell narrow"><div class="panel"><div class="row between"><div><div class="eyebrow">СНАБЖЕНИЕ</div><h2>Торговый автомат</h2></div><b class="badge">${s.coins} кредитов</b></div><div class="stack mt">${s.room.stock.map((q,j)=>{const name=q.id==='heal'?'Аптечка: +40 HP':q.id==='key'?'Ключ от контейнера':E.item[q.id].name,desc=E.item[q.id]?.desc||'Применяется к покупателю.';return `<div class="banner row between"><div><b>${name}</b><div class="hint">${desc}</div></div>${E.btn('buy',q.bought?'Продано':q.price+' ¤','small',j,q.bought||s.coins<q.price||s.offer.done[E.seat])}</div>`}).join('')}</div><div class="row mt">${E.btn('shopdone',s.offer.done[E.seat]?'Ждём напарника':'Закончить покупки','primary','',s.offer.done[E.seat])}</div></div></div>`};
E.eventHTML=()=>{const o=E.S.offer,info={curse:['Разлом требует кровь','Отдать 28 HP и получить два случайных хаотических модуля. Здоровье должно остаться выше нуля.','Принять сделку'],reroll:['Нестабильный арсенал','За 25 кредитов получить случайное оружие и случайный модуль. Текущие улучшения сохраняются.','Пересобрать оружие'],altar:['Обмен с неизвестным','Отдать 18 HP за выбор одного из трёх модулей.','Согласиться'],gift:['Забытое сообщение','Открыть капсулу: 65% — кредиты и ключ, иначе — случайный модуль.','Открыть капсулу']}[o.event];return `<div class="shell narrow"><div class="panel"><div class="eyebrow">${E.esc(o.source)}</div><h2>${info[0]}</h2><p class="lead mt">${info[1]}</p><div class="row mt">${o.seat===E.seat?E.btn('event',info[2],'gold','yes')+E.btn('event','Отказаться','ghost','no'):'<p class="hint">Решение принимает напарник, открывший протокол.</p>'}</div></div></div>`};
E.inventoryHTML=()=>{const s=E.S,p=s.players[E.seat],st=E.stats(p),sy=E.synergies.filter(x=>p.mods[x[0]]&&p.mods[x[1]]);return `<div class="shell"><div class="panel"><div class="row between"><div><div class="eyebrow">ТЕКУЩАЯ СБОРКА</div><h2>${E.classes[p.cls].name} / ${E.weapons[p.weapon].name}</h2></div>${E.btn('close','Вернуться','primary')}</div><div class="stats"><div><strong>${st.damage.toFixed(2)}×</strong><span>Базовый урон</span></div><div><strong>${st.rate.toFixed(2)}×</strong><span>Темп стрельбы</span></div><div><strong>${Math.round(st.hp)}</strong><span>Здоровье</span></div><div><strong>${Math.round(st.crit*100)}%</strong><span>Крит</span></div></div>${sy.length?`<div class="banner mb"><b>Активные синергии</b>${sy.map(x=>`<div class="hint mt8"><span style="color:var(--gold)">${x[2]}</span> — ${x[3]}</div>`).join('')}</div>`:''}<div class="modlist">${Object.entries(p.mods).map(([id,n])=>`<div class="mod"><span class="icon">${E.item[id].icon}</span><strong>${E.item[id].name} ×${n}</strong><p class="hint mt8">${E.item[id].desc}</p></div>`).join('')||'<p class="hint">Модули появятся после первой находки.</p>'}</div><p class="hint mt">Seed: <span class="mono">${E.esc(s.seed)}</span> · ${E.mutations[s.mutation].desc}</p></div></div>`};
E.helpHTML=()=>`<div class="shell narrow"><div class="panel"><div class="eyebrow">ПОЛЕВОЙ СПРАВОЧНИК</div><h2>Не теряй темп</h2><div class="stack mt"><div class="banner"><b>Маршрут</b><p class="hint">Проходи боевые комнаты до босса. После победы портал появляется в этой же комнате. Терминалов, заставляющих возвращаться к входу, больше нет. Фиолетовые ответвления — добровольный риск и награды.</p></div><div class="banner"><b>Комнаты и награды</b><p class="hint">Шлюзы открываются после всех волн. Артефакт — выбор модуля; снабжение — покупки за кредиты; испытание — три волны; сделка — здоровье в обмен на хаотические эффекты. Карту можно открыть и нажать на зачищенную комнату для быстрого перехода, когда текущая безопасна.</p></div><div class="banner"><b>Телефон</b><p class="hint">Левый стик — движение. Правый стик — ручной прицел и огонь. ↗ — рывок с короткой неуязвимостью. ⌘ — классовое умение. ◎ — взаимодействие; удерживай для подъёма напарника. ∞ — резонанс: очищает пули, заряжает щиты и замедляет врагов.</p></div><div class="banner"><b>Компьютер</b><p class="hint">WASD — движение. Мышь и ЛКМ — ручной огонь, когда автоогонь отключён. Пробел — рывок. Q — умение. E — действие. R — резонанс. F — перезарядка. Tab — карта. I — сборка. Esc — пауза.</p></div><div class="banner"><b>Сохранение и смерть</b><p class="hint">Автосохранение на входе и после зачистки комнаты, после наград и покупок. «Сохранить и выйти» сохраняет точное состояние. В одиночном режиме смерть завершает забег. Вдвоём можно поднимать друг друга; поражение, когда падают оба. Закрытие браузера без выхода может вернуть к последнему автосохранению.</p></div><div class="banner warn">Одиночные меню ставят бой на паузу. В кооперативе карта и сборка не останавливают бой; для остановки обоих используй кнопку паузы.</div></div><div class="row mt">${E.btn('close','Понятно','primary')}</div></div></div>`;
E.settingsHTML=()=>`<div class="shell narrow"><div class="panel"><div class="eyebrow">ВАШЕ УСТРОЙСТВО</div><h2>Изображение и управление</h2><div class="mt"><label>Качество эффектов</label><select id="quality"><option value="high" ${E.opts.quality==='high'?'selected':''}>Высокое — свечение, атмосфера, больше частиц</option><option value="low" ${E.opts.quality==='low'?'selected':''}>Экономное — ниже разрешение и меньше эффектов</option></select></div><label class="toggle">Автоогонь<input data-pref="auto" type="checkbox" ${E.opts.auto?'checked':''}></label><label class="toggle">Автоприцел<input data-pref="aim" type="checkbox" ${E.opts.aim?'checked':''}></label><div class="mt"><label>Громкость</label><input id="volume" type="range" min="0" max="100" value="${E.opts.volume*100}"></div><p class="hint mt">Правый стик всегда переключает на ручной прицел. Все эффекты рисуются локально; внешние текстуры не загружаются.</p><div class="row mt">${E.btn('close','Готово','primary')}${E.btn('fullscreen','⛶ Полный экран','ghost')}</div></div></div>`;
E.pauseHTML=()=>`<div class="shell narrow"><div class="panel"><div class="eyebrow">КОНТУР ПРИОСТАНОВЛЕН</div><h2>${E.mode==='online'&&!E.net.connected.every(Boolean)?'Соединение прервано':'Пауза'}</h2><p class="hint mt">${E.mode==='online'&&!E.net.connected.every(Boolean)?'Ждём восстановления подключения напарника. Бой остановлен.':'Вы не теряете прогресс, пока игра на паузе.'}</p><div class="stack mt">${E.btn('resume','Продолжить','primary','',E.mode==='online'&&!E.net.connected.every(Boolean))}${E.btn('settings','Настройки','ghost')}${E.btn('help','Управление','ghost')}${E.btn('saveexit','Сохранить и выйти','ghost')}${E.btn('title','В главное меню','danger')}</div></div></div>`;
E.endHTML=()=>{const s=E.S,win=s.status==='win';return `<div class="shell narrow"><div class="panel"><div class="eyebrow">${win?'ПРОТОКОЛ ЗАВЕРШЁН':'КОНТУР ПОТЕРЯН'}</div><h2>${win?'Вы вернули станции выбор.':'Сигнал оборвался.'}</h2><p class="lead mt">${win?'Ядро отключено. Криокапсулы открываются, а за иллюминаторами поднимается свет настоящей звезды. Эта экспедиция завершена.':'Станция сохранит твой маршрут, но не повторит его. Новый seed — новые комнаты, награды и сочетания.'}</p><div class="stats"><div><strong>${s.floor+1}/5</strong><span>Секторы</span></div><div><strong>${s.rooms}</strong><span>Комнаты</span></div><div><strong>${s.kills}</strong><span>Противники</span></div><div><strong>${Math.floor(s.t/60)}:${String(Math.floor(s.t%60)).padStart(2,'0')}</strong><span>Время</span></div></div><div class="banner">Seed забега: <span class="mono">${E.esc(s.seed)}</span></div><div class="row mt">${E.mode==='online'&&E.seat===1?'<p class="hint">Ведущий может начать новый рейс.</p>':E.btn('again','Новый случайный забег','primary')}${E.btn('title','В главное меню','ghost')}</div></div></div>`};
E.mapHTML=()=>`<div class="shell narrow"><div class="panel"><div class="row between"><div><div class="eyebrow">КАРТА СЕКТОРА ${E.S.floor+1}</div><h2>${E.biomes[E.S.floor].name}</h2></div>${E.btn('close','Вернуться','primary')}</div><canvas id="mapcanvas"></canvas><div class="maplegend"><span>• / ▲ — основной путь</span><span>✦ — артефакт</span><span>¤ — магазин</span><span>☠ — босс</span></div><p class="hint mt">${E.S.room.clear?'Нажми на уже зачищенную комнату для мгновенного перехода.':'Быстрый переход доступен после зачистки текущей комнаты.'} Неисследованные дальние комнаты скрыты.</p></div></div>`;
E.ui=()=>{
 const s=E.S,overlay=E.$('#overlay');let key=E.screen+':'+E.menu+':'+(s?.status||'')+':'+(s?.paused||false)+':'+(s?.offer?JSON.stringify(s.offer)+s.coins+JSON.stringify(s.room.stock):'')+(E.screen==='setup'?JSON.stringify(E.config)+E.net.connected:'');
 if(key!==E.uiKey){E.uiKey=key;let html='';if(E.menu==='settings')html=E.settingsHTML();else if(E.menu==='help')html=E.helpHTML();else if(E.menu==='bag'&&s)html=E.inventoryHTML();else if(E.menu==='map'&&s)html=E.mapHTML();else if(E.screen==='title')html=E.title();else if(E.screen==='setup')html=E.setupHTML();else if(E.screen==='network')html=E.networkHTML();else if(s?.status!=='play'&&s)html=E.endHTML();else if(s?.paused)html=E.pauseHTML();else if(s?.offer)html=s.offer.type==='item'?E.itemHTML():s.offer.type==='shop'?E.shopHTML():E.eventHTML();overlay.innerHTML=html;overlay.classList.toggle('empty',!html);if(E.menu==='map')E.bindMap();}
 const game=E.screen==='game'&&s;E.$('#hud').style.display=game?'block':'none';const active=game&&s.status==='play'&&!s.paused&&!s.offer&&!E.menu;E.$('#touch').style.display=active&&E.coarse?'block':'none';if(!active)E.resetInput?.();
 if(game){const p=s.players[E.seat]||s.players[0],st=E.stats(p);E.$('#pilot').textContent=E.classes[p.cls].name.toUpperCase();E.$('#healthtext').textContent=Math.ceil(p.hp)+' / '+st.hp;E.$('#healthbar').style.width=(p.hp/st.hp*100)+'%';E.$('#shieldbar').style.width=(p.shield/st.shield*100)+'%';E.$('#floorname').textContent=String(s.floor+1).padStart(2,'0')+' / '+E.biomes[s.floor].name;E.$('#floordetail').textContent=E.mutations[s.mutation].name+' · '+['Исследователь','Ветеран','Кошмар'][s.diff];E.$('#gun').textContent=E.weapons[p.weapon].name;E.$('#ammo').textContent=p.reload>0?'↻ '+p.reload.toFixed(1):p.ammo+' / '+st.clip;E.$('#money').textContent=s.coins+' ¤ · '+s.keys+' ключ';E.$('#resbar').style.width=s.resonance+'%';E.$('#objective').textContent=p.down?'Удерживайте действие рядом с раненым':s.room.locked?'Охрана: '+s.enemies.length+' · волна '+Math.max(1,s.room.wave)+' / '+s.room.waves:s.graph.rooms[s.room.id].kind==='boss'?'Портал в этой комнате · E / ◎ для перехода':'Безопасно · E / ◎ у шлюза или предмета';
  const boss=s.enemies.find(e=>e.type==='boss'&&e.hp>0);E.$('#bossbar').style.display=boss?'block':'none';if(boss){E.$('#bossname').textContent=E.biomes[s.floor].boss+(boss.shielded?' / ЗАЩИТНЫЕ УЗЛЫ':'');E.$('#bosshp').style.width=boss.hp/boss.max*100+'%'}
  for(const [id,value]of [['tdash',p.dash],['tskill',p.skill],['tres',s.resonance<100?Math.ceil(s.resonance):0]]){const el=E.$('#'+id+' b');el.style.display=value>.05?'grid':'none';el.textContent=id==='tres'?value+'%':Math.ceil(value)}
  E.mapDraw(E.$('#minimap'));if(E.menu==='map')E.mapDraw(E.$('#mapcanvas'),true);
 }
 E.notices=E.notices.filter(n=>n.end>E.clock);E.$('#toasts').innerHTML=E.notices.map(n=>`<div class="toast ${n.bad?'bad':''}">${E.esc(n.text)}</div>`).join('');
};
E.bindMap=()=>{const cv=E.$('#mapcanvas');if(!cv)return;E.mapDraw(cv,true);cv.addEventListener('click',ev=>{const rect=cv.getBoundingClientRect(),m=cv._map;if(!m)return;const x=ev.clientX-rect.left,y=ev.clientY-rect.top,n=m.nodes.find(n=>Math.abs(x-(m.ox+n.x*m.scale))<m.scale*.42&&Math.abs(y-(m.oy+n.y*m.scale))<m.scale*.35);if(n&&E.canWarp(n.id)){E.act('warp',n.id);E.menu=null;E.uiKey='';}else if(n)E.notice('Эта комната ещё не зачищена или уже выбрана.');})};
E.resetInput=()=>{E.touch={x:0,y:0,ax:1,ay:0,aim:false,fire:false};E.keys.clear();E.pressed.clear();E.mouse.down=false;document.querySelectorAll('.stick i').forEach(n=>n.style.transform='translate(0,0)');document.querySelectorAll('.actions button').forEach(n=>n.classList.remove('pressed'))};
E.localAction=(a,v)=>{
 E.audio.start();
 if(a==='setup'){E.mode=v;E.seat=0;E.S=null;E.screen='setup';E.menu=null;E.config.ready=[true,v!=='online'];E.config.names[1]='Ирис';}
 else if(a==='network'){E.screen='network';E.menu=null;}
 else if(a==='title'){E.disconnect?.();E.S=null;E.screen='title';E.menu=null;E.fx=[];}
 else if(a==='close'){E.menu=null;}
 else if(['help','settings','bag','map'].includes(a)){if(['bag','map'].includes(a)&&!E.S)return;E.menu=E.menu===a?null:a;E.resetInput();}
 else if(a==='pause'){E.act('pause',true);E.menu=null;E.resetInput();}
 else if(a==='resume'){E.act('pause',false);E.menu=null;}
 else if(a==='class'){E.act('config',{field:'cls',value:v});}
 else if(a==='daily'){E.config.seed='DAILY-'+E.daily();}
 else if(a==='ready'){E.act('ready');}
 else if(a==='start'){const seed=E.$('#seed');if(seed)E.config.seed=seed.value.slice(0,40);E.act('start');}
 else if(a==='continue'){const d=E.load('helios3-save',null);if(d?.state.mode==='online'){E.notice('Сетевое сохранение: восстановите прежнюю комнату на сервере.',true);E.screen='network';}else E.restore();}
 else if(a==='again'){E.config.seed='';E.act('start');}
 else if(a==='saveexit'){if(E.mode==='online'&&E.seat!==0){E.notice('Сохранение хранится у ведущего.');return}E.save();E.disconnect?.();E.S=null;E.screen='title';E.menu=null;}
 else if(['item','buy','shopdone','event'].includes(a))E.act(a,v);
 else if(a==='fullscreen'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>E.notice('Полный экран недоступен.'));else document.exitFullscreen?.();}
 else if(a==='create'||a==='join'){E.profile.name=(E.$('#netname').value.trim()||'Искатель').slice(0,24);E.store('helios3-profile',E.profile);E.connect(a,E.$('#netcode').value.trim().toUpperCase());}
 else if(a==='openserver'){let v=E.$('#serveraddress').value.trim();if(!/^https?:\/\//i.test(v))v='http://'+v;try{const u=new URL(v);if(!['http:','https:'].includes(u.protocol)||u.username||u.password)throw Error();if(!u.port&&u.protocol==='http:')u.port='8787';location.assign(u.href)}catch{E.notice('Нужен адрес вида http://192.168.1.10:8787',true)}}
 E.uiKey='';E.ui();
};
document.addEventListener('click',ev=>{const b=ev.target.closest('button[data-a]');if(b&&!b.disabled)E.localAction(b.dataset.a,b.dataset.v||'')});
E.$('#minimap').addEventListener('click',()=>E.localAction('map'));
document.addEventListener('change',ev=>{const t=ev.target;if(t.id==='weapon')E.act('config',{field:'weapon',value:t.value});if(t.id==='difficulty')E.act('config',{field:'diff',value:Number(t.value)});if(t.id==='seed')E.act('config',{field:'seed',value:t.value.slice(0,40)});if(t.id==='quality'){E.opts.quality=t.value;E.resize()}if(t.dataset.pref)E.opts[t.dataset.pref]=t.checked;E.store('helios3-options',E.opts);E.uiKey='';});
document.addEventListener('input',ev=>{if(ev.target.id==='volume'){E.opts.volume=Number(ev.target.value)/100;E.audio.start();E.store('helios3-options',E.opts)}});

</script><script>
'use strict';
E.act=(action,value)=>{if(E.mode==='online'&&E.seat===1){E.send({type:'action',action,value});return}E.action(E.seat,action,value);};
E.action=(seat,a,v)=>{
 const s=E.S,c=E.config;
 if(a==='config'&&E.screen==='setup'){
  if(!v||typeof v!=='object')return;
  if(v.field==='cls'&&E.classes[v.value])c.cls[seat]=v.value;
  if(v.field==='weapon'&&E.weapons[v.value])c.weapon[seat]=v.value;
  if(v.field==='diff'&&seat===0&&[0,1,2].includes(Number(v.value)))c.diff=Number(v.value);
  if(v.field==='seed'&&seat===0)c.seed=String(v.value).slice(0,40);
  if(seat===1)c.ready[1]=false;E.broadcastLobby();E.uiKey='';return;
 }
 if(a==='ready'&&E.screen==='setup'){c.ready[seat]=!c.ready[seat];E.broadcastLobby();E.uiKey='';return}
 if(a==='start'&&seat===0){if(E.mode==='online'&&(!E.net.connected.every(Boolean)||!c.ready[1]))return;if(s?.status==='play')return;E.newRun(E.mode,c.seed);E.sendState();return}
 if(!s||s.status!=='play'||!s.players[seat])return;
 if(a==='pause'){if(!v&&E.mode==='online'&&!E.net.connected.every(Boolean))return;s.paused=!!v;E.uiKey='';return}
 if(a==='warp'){E.warp(Number(v));return}
 if(a==='item'&&s.offer?.type==='item'){const o=s.offer;if(o.picked[seat]||!o.options[seat].includes(v))return;E.give(s.players[seat],v);o.picked[seat]=true;if(o.picked.every(Boolean))s.offer=null;E.save();E.uiKey='';return}
 if(a==='buy'&&s.offer?.type==='shop'){if(s.offer.done[seat])return;const q=s.room.stock[Number(v)],p=s.players[seat];if(!q||q.bought||s.coins<q.price)return;s.coins-=q.price;q.bought=true;if(q.id==='heal')p.hp=Math.min(E.stats(p).hp,p.hp+40);else if(q.id==='key')s.keys++;else E.give(p,q.id);E.save();E.uiKey='';return}
 if(a==='shopdone'&&s.offer?.type==='shop'){s.offer.done[seat]=true;if(s.offer.done.every(Boolean))s.offer=null;E.save();E.uiKey='';return}
 if(a==='event'&&s.offer?.type==='event'){E.eventChoice(seat,v==='yes');E.uiKey='';}
};
E.send=data=>{const ws=E.net.ws;if(ws?.readyState===1&&ws.bufferedAmount<500000){ws.send(JSON.stringify(data,(k,v)=>typeof v==='number'?Math.round(v*1000)/1000:v));return true}return false};
E.sendState=()=>{if(E.mode==='online'&&E.seat===0&&E.S)E.send({type:'state',state:E.S})};
E.broadcastLobby=()=>{if(E.mode==='online'&&E.seat===0)E.send({type:'lobby',data:{...E.config,version:E.version}})};
E.disconnect=()=>{const n=E.net;n.intentional=true;clearTimeout(n.retryTimer);if(n.ws){n.ws.onclose=null;n.ws.close()}n.ws=null;n.online=false;n.connected=[false,false];n.code='';n.token='';try{sessionStorage.removeItem('helios3-session')}catch{}E.mode='solo';E.seat=0;};
E.connect=(kind,code='',token='')=>{
 if(!['http:','https:'].includes(location.protocol)){E.notice('Сначала откройте адрес запущенного сервера.',true);return}
 const n=E.net;if(n.ws){n.ws.onclose=null;n.ws.close()}n.intentional=false;n.action=kind;E.mode='online';
 let ws;try{ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/ws')}catch{E.notice('Не удалось создать соединение.',true);return}n.ws=ws;
 ws.onopen=()=>{n.online=true;E.send({type:kind,code,token,name:E.profile.name||'Искатель'});};
 ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch{return}
  if(m.type==='error'){E.notice(m.message||'Ошибка соединения.',true);if(kind==='resume'){n.intentional=true;n.token='';try{sessionStorage.removeItem('helios3-session')}catch{}}return}
  if(m.type==='welcome'){
   E.seat=m.seat;n.code=m.code;n.token=m.token;n.retry=0;E.config.names=m.names;try{sessionStorage.setItem('helios3-session',JSON.stringify({code:m.code,token:m.token}))}catch{}
   if(kind==='resume'&&E.seat===0&&!E.S){const saved=E.load('helios3-save',null);if(saved?.version===E.version&&saved.state.mode==='online'){E.S=saved.state;E.config=saved.config;E.S.paused=true;E.lastFX=E.S.eventId;E.cam.snap=true}}
   E.screen=E.S?'game':'setup';E.menu=null;E.uiKey='';if(E.seat===0)E.broadcastLobby();E.notice('Комната '+m.code+' · соединение установлено.');
  }
  if(m.type==='presence'){const before=n.connected;n.connected=m.connected;if(E.S&&!m.connected.every(Boolean))E.S.paused=true;if(E.seat===0){if(!m.connected[1]&&before[1]){E.config.ready[1]=false;if(E.S){E.S.paused=true;E.save();E.notice('Напарник отключился. Бой остановлен.')}}E.config.names=m.names;E.broadcastLobby();E.sendState()}E.uiKey='';}
  if(m.type==='lobby'&&E.seat===1){if(m.data.version!==E.version){E.notice('Разные версии игры. Откройте одну версию сервера.',true);return}E.config=m.data;E.uiKey='';}
  if(m.type==='input'&&E.seat===0){n.input=m.input||{};n.inputAt=performance.now();}
  if(m.type==='action'&&E.seat===0)E.action(m.seat,m.action,m.value);
  if(m.type==='state'&&E.seat===1){if(m.state?.version!==E.version)return;const old=E.S;if(!old||old.room?.id!==m.state.room?.id||old.floor!==m.state.floor||old.seed!==m.state.seed){E.cache.clear();E.cam.snap=true;E.fx=[];}E.S=m.state;E.screen='game';}
 };
 ws.onerror=()=>E.notice('Сервер недоступен. Нужен комплектный Python-сервер и доступ к нему по LAN / VPN.',true);
 ws.onclose=()=>{n.online=false;if(n.intentional)return;if(E.S){E.S.paused=true;if(E.seat===0)E.save()}E.notice('Соединение потеряно. Повторное подключение…',true);E.uiKey='';if(n.token){n.retry=(n.retry||0)+1;n.retryTimer=setTimeout(()=>E.connect('resume',n.code,n.token),Math.min(8000,1000*n.retry))}};
};

</script><script>
'use strict';
if(E.coarse)document.body.classList.add('coarse');
for(const [id,aim]of [['move',false],['aim',true]]){
 const el=E.$('#'+id),knob=el.querySelector('i');let pid=null;
 const update=ev=>{if(ev.pointerId!==pid)return;const r=el.getBoundingClientRect(),dx=ev.clientX-r.left-r.width/2,dy=ev.clientY-r.top-r.height/2,len=Math.hypot(dx,dy),radius=r.width*.32,k=len>radius?radius/len:1;knob.style.transform=`translate(${dx*k}px,${dy*k}px)`;if(aim){if(len>6){E.touch.ax=dx/len;E.touch.ay=dy/len}E.touch.aim=true;E.touch.fire=true}else{E.touch.x=len<5?0:dx*k/radius;E.touch.y=len<5?0:dy*k/radius}};
 el.addEventListener('pointerdown',ev=>{if(pid!==null)return;ev.preventDefault();pid=ev.pointerId;el.setPointerCapture(pid);E.audio.start();update(ev)});el.addEventListener('pointermove',ev=>{if(ev.pointerId===pid){ev.preventDefault();update(ev)}});
 const end=ev=>{if(ev.pointerId!==pid)return;pid=null;knob.style.transform='translate(0,0)';if(aim){E.touch.aim=false;E.touch.fire=false}else E.touch.x=E.touch.y=0};for(const event of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(event,end);
}
