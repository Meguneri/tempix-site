 tone(freq,dur,type='sine',gain=.1,start=null,end=null,dest=null){if(!this.ctx||prefs.volume===0)return;let t=start??this.ctx.currentTime;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(Math.max(20,freq),t);if(end)o.frequency.exponentialRampToValueAtTime(Math.max(20,end),t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,gain),t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(dest||this.master);o.start(t);o.stop(t+dur+.03)},
 noise(dur=.08,gain=.1){if(!this.ctx||prefs.volume===0)return;let n=Math.floor(this.ctx.sampleRate*dur),buf=this.ctx.createBuffer(1,n,this.ctx.sampleRate),data=buf.getChannelData(0);for(let i=0;i<n;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);let src=this.ctx.createBufferSource(),f=this.ctx.createBiquadFilter(),g=this.ctx.createGain();src.buffer=buf;f.type='lowpass';f.frequency.value=2500;g.gain.value=gain;src.connect(f);f.connect(g);g.connect(this.master);src.start()},
 effect(kind,variant){if(!this.ctx||this.ctx.state!=='running')return;let now=this.ctx.currentTime;if(now-(this.last[kind]||-99)<({shot:.045,hit:.10,boom:.08}[kind]||.14))return;this.last[kind]=now;
 if(kind==='shot'){if(variant==='rail'){this.tone(1100,.16,'sawtooth',.065,null,120)}else if(variant==='arc'){this.tone(850,.11,'triangle',.10,null,100)}else if(variant==='launcher'){this.tone(150,.15,'sawtooth',.075,null,45)}else{this.noise(.045,variant==='scatter'?.18:.075);this.tone(160,.05,'triangle',.08,null,55)}}

function controlsHelp(){return `<div class="helpgrid"><div class="helpbox"><h3>Ваш искатель</h3><p><kbd>WASD</kbd> движение · мышь — прицел · <kbd>ЛКМ</kbd> огонь.<br><kbd>Пробел</kbd> неуязвимый рывок · <kbd>Q</kbd> классовое умение.<br><kbd>E</kbd> взаимодействие / поднять напарника.<br><kbd>R</kbd> общий резонанс · <kbd>F</kbd> перезарядка.<br><kbd>N</kbd> после зачистки — снабжение / следующий отсек.<br><kbd>Esc</kbd> пауза · <kbd>M</kbd> звук · <kbd>F1</kbd> эта памятка.</p></div><div class="helpbox"><h3>Вдвоём за одной клавиатурой</h3><p>Второй искатель: <kbd>↑ ↓ ← →</kbd> движение. Он автоматически целится и стреляет.<br><kbd>Правый Shift</kbd> / <kbd>Num 1</kbd> рывок.<br><kbd>End</kbd> / <kbd>Num 2</kbd> умение.<br><kbd>Delete</kbd> / <kbd>Num 3</kbd> взаимодействие.<br><kbd>Home</kbd> / <kbd>Num 4</kbd> резонанс.<br>Оба выбирают модули мышью по очереди.</p></div><div class="helpbox"><h3>Как выжить вместе</h3><p>Рядом друг с другом вы быстрее восстанавливаете щиты, если несколько секунд не получаете урон. Дружественного огня нет.<br>Раненого можно поднять: держите <kbd>E</kbd> рядом 3 секунды. Биотех делает это вдвое быстрее. Не успели за 40 секунд — напарник вернётся после зачистки отсека. Если упали оба, рейс окончен.</p></div><div class="helpbox"><h3>Маршрут и прогресс</h3><p>В кампании 12 отсеков и 3 босса. После каждого отсека — бесплатный модуль каждому, магазин и выбор пути. Кредиты общие, модули личные.<br>Ячейки берутся и устанавливаются клавишей <kbd>E</kbd>. Терминалы взламываются удержанием <kbd>E</kbd>. Эскортного дрона так же можно чинить.<br>Круги на полу предупреждают об ударах. У боссов разрушайте защитные узлы.</p></div></div><div class="banner mt">Автосохранение — в начале отсека и между отсеками, в браузере ведущего. После поражения можно повторить текущий отсек. Архив и достижения остаются между рейсами.</div>`}

function archiveHTML(){const badges=[['first','Первый рассвет','Пройти кампанию'],['clean','Ни шагу назад','Победа без падений'],['abyss','Бездна','Победить на максимальной сложности'],['archives','Все имена','Найти все 12 записей за один рейс'],['hunter','Охотники','300 врагов за один рейс'],['savior','Плечом к плечу','Трижды поднять напарника']];return `<div class="shell"><div class="panel"><div class="row between mb"><div><div class="eyebrow">БОРТОВОЙ АРХИВ</div><h2>То, что останется</h2></div>${button('closemodal','Назад','ghost')}</div><div class="row wrap mb"><span class="chip cyan">ПОБЕД: ${profile.wins}</span><span class="chip">ВРАГОВ: ${profile.kills}</span><span class="chip">ЗАПИСЕЙ: ${profile.logs.length}/12</span></div><div class="badge-grid">${badges.map(([id,n,d])=>`<div class="badge ${profile.badges.includes(id)?'unlocked':''}"><strong>${profile.badges.includes(id)?'✓':'◇'} ${n}</strong><br>${d}</div>`).join('')}</div><div class="two-col mt">${LOGS.map(([n,t],i)=>`<div class="log-entry"><h3>${String(i+1).padStart(2,'0')} / ${profile.logs.includes(i)?n:'Зашифрованная запись'}</h3><p>${profile.logs.includes(i)?t:'Найдите планшет в отсеке '+(i+1)+' и нажмите E.'}</p></div>`).join('')}</div></div></div>`}

 const hud=$('#hud'),veil=$('#veil');hud.style.display=screen==='game'&&G?'block':'none';

 }

function updateHUD(){
 for(const p of G.players){let s=stat(p);$('#p'+p.id+'hud').innerHTML=`<div class="player-title"><span style="color:${COLORS[p.id]}">${esc(p.name)}</span><span>${p.dead?'НЕТ СИГНАЛА':p.down?'РАНЕН':CLASSES[p.cls].name}</span></div><div class="hp-track"><div style="width:${clamp(p.hp/s.maxHp*100,0,100)}%"></div></div><div class="shield-track"><div style="width:${clamp(p.shield/s.maxShield*100,0,100)}%"></div></div><div class="player-detail"><span>${Math.ceil(p.hp)}/${s.maxHp} HP · ${Math.ceil(p.shield)} ЩИТ</span><span>${p.down?Math.ceil(p.downTime)+'с':p.reload>0?'ПЕРЕЗАР.':p.ammo+'/'+s.clip}</span></div>`}
 const o=G.objective;let detail='';if(o.type==='purge')detail=`Волна ${Math.max(1,o.wave)} / ${o.waves} · Врагов: ${G.enemies.length}${o.spawnLeft?' + подкрепление':''}`;if(o.type==='uplink')detail=G.objects.filter(x=>x.type==='terminal').map((x,i)=>`Терминал ${i+1}: ${Math.floor(x.charge/x.target*100)}%`).join(' · ');if(o.type==='reactor')detail=o.delivered<3?`Установлено ячеек: ${o.delivered}/3 · E — взять / установить`:`Стабилизация реактора: ещё ${Math.ceil(Math.max(0,45-(o.boot||0)))} секунд`;if(o.type==='escort')detail=`Дрон: ${Math.ceil(o.drone.hp)}/${o.drone.maxHp} · держитесь рядом · E — ремонт`;if(o.type==='survival')detail=`Осталось ${Math.ceil(Math.max(0,o.target-G.roomTime))} секунд`;if(o.type==='boss')detail='Красные зоны опасны. Разрушайте защитные узлы.';
 if(G.phase==='cleared')detail='Осмотрите отсек и соберите записи. N — '+(G.stage===11?'начать эвакуацию':'перейти к снабжению');
 $('#mission').innerHTML=`<div class="eyebrow">${ACTS[G.act].name} / ${G.stage+1} ИЗ 12</div><strong>${G.phase==='cleared'?'ОТСЕК БЕЗОПАСЕН':OBJECTIVES[o.type].label}</strong><p>${detail}</p><div class="progress-track"><div class="progress-fill" style="width:${clamp(o.progress||0,0,1)*100}%"></div></div>`;
 const p=G.players[localSeat],s=stat(p);$('#abilities').innerHTML=`<div class="ability ${p.dashcd<=0?'ready':''}"><span>ПРОБЕЛ</span><b>Рывок</b><span>${p.dashcd>0?p.dashcd.toFixed(1)+' c':'ГОТОВ'}</span></div><div class="ability ${p.qcd<=0?'ready':''}"><span>Q</span><b>${CLASSES[p.cls].name}</b><span>${p.qcd>0?p.qcd.toFixed(1)+' c':'УМЕНИЕ ГОТОВО'}</span></div><div class="ability"><span>E</span><b>Действие</b><span>ВЗЛОМ / ПОМОЩЬ</span></div>`;
 $('#resonance').innerHTML=`<div class="row between"><strong>R / РЕЗОНАНС</strong><span>${G.surge>0?G.surge.toFixed(1)+'с':Math.floor(G.resonance)+'%'}</span></div><div class="progress-track mt" style="margin-top:8px"><div class="progress-fill" style="width:${G.surge>0?G.surge/7*100:G.resonance}%"></div></div>`;
 $('#runmeta').innerHTML=`${fmtTime(G.t)} · ${G.credits} КР. · ${G.score} ОЧКОВ<br>${MUTATORS[G.mutator].name}${mode==='online'?' · '+network.latency+' мс':''}<br>${G.phase==='cleared'?button('debrief',G.stage===11?'N / Эвакуация':'N / Снабжение','hudbutton primary'):''}${button('pause','Esc / Пауза','hudbutton')}${button('helpgame','F1 / Памятка','hudbutton')}`;
 const boss=G.enemies.find(e=>e.type==='boss');$('#bossbar').style.display=boss?'block':'none';if(boss)$('#bossbar').innerHTML=`${boss.name} / ФАЗА ${boss.phase}${boss.shielded?' / ЩИТ АКТИВЕН':''}<div class="bosstrack"><div style="width:${boss.hp/boss.maxHp*100}%;height:100%"></div></div>`;
}
function setPause(value,reason=''){if(!G||['win','loss'].includes(G.phase))return;paused=value;G.paused=value;pauseReason=reason;G.pauseReason=reason;keys.clear();taps.clear();mouse.down=false;uiKey='';if(mode==='online'&&localSeat===0)sendState()}
function dispatch(action,value,seat=localSeat){if(mode==='online'&&localSeat===1){send({type:'action',action,value});return}handleAction(seat,action,value)}
function handleAction(seat,action,value){
 if(action==='class'||action==='weapon'){if(screen!=='hangar'||seat<0||seat>1)return;const map=action==='class'?CLASSES:WEAPONS;if(!map[value])return;lobby[action==='class'?'classes':'weapons'][seat]=value;if(seat===1)lobby.ready[1]=false;lobbyDirty=true;uiKey='';return}
 if(action==='ready'){lobby.ready[seat]=!lobby.ready[seat];lobbyDirty=true;uiKey='';return}
 if(action==='pause'){setPause(true,seat===1?'Напарник поставил игру на паузу.':'Пауза ведущего.');return}
 if(action==='unpause'){if(mode==='online'&&!network.connected.every(Boolean))return;setPause(false);return}
 if(!G)return;
 if(action==='debrief'&&G.phase==='cleared'){enterUpgrade();uiKey='';return}
 if(action==='upgrade'&&G.phase==='upgrade'){if(G.picked[seat]||!G.choices[seat].includes(value))return;addUpgrade(G.players[seat],value);G.picked[seat]=value;addEvent('pickup',G.players[seat].x,G.players[seat].y,COLORS[seat]);if(G.picked.every(Boolean))enterRoute();uiKey='';return}
 if(action==='reroll'&&G.phase==='upgrade'){if(G.picked[seat]||G.shop.reroll[seat]||G.credits<25)return;G.credits-=25;G.shop.reroll[seat]=true;G.choices[seat]=upgradeOptions(G.players[seat]);uiKey='';return}
 if(action==='buy'&&G.phase==='upgrade'){
  if(value==='heal'&&!G.shop.heal&&G.credits>=60){G.credits-=60;G.shop.heal=true;for(const p of G.players)p.hp=Math.min(stat(p).maxHp,p.hp+50)}
  if(value==='hull'&&!G.shop.hull&&G.credits>=90){G.credits-=90;G.shop.hull=true;for(const p of G.players){p.bonusHp+=10;p.hp+=10}}
  uiKey='';return;
 }
 if(action==='vote'&&G.phase==='route'){let k=Number(value);if(![0,1].includes(k))return;G.votes[seat]=k;if(G.votes[0]!==null&&G.votes[0]===G.votes[1])beginRoom(G.stage+1,G.route[k]);uiKey='';return}
 if(action==='resolvevote'&&seat===0&&G.phase==='route'&&G.votes[0]!==null&&G.votes[1]!==null){beginRoom(G.stage+1,G.route[G.votes[0]]);uiKey='';return}
}

function leaveToTitle(){if(mode==='online'){if(localSeat===0&&G){G.phase='ended';sendState()}disconnectNet()}G=null;mode='bot';localSeat=0;screen='title';modal=null;paused=false;uiKey='';floorKey='';fx=[];$('#radio').classList.remove('show')}

function controlsHelp(){return `<div class="helpgrid"><div class="helpbox"><h3>Телефон</h3><p>Левый стик — движение. Правый — прицеливание и стрельба. По умолчанию включены автоприцел и автоогонь: можно сосредоточиться на движении.<br><b>↗</b> — неуязвимый рывок. <b>⌘</b> — умение класса. <b>∞</b> — общий резонанс при 100%. <b>◎</b> — удерживать для взлома, ремонта, спасения и перехода в лифт.<br>Мини-карта открывает схему палубы. Кнопка ⏸ — пауза для обоих.</p></div><div class="helpbox"><h3>Не просто большая арена</h3><p>Каждая из 12 палуб состоит из 12 связанных помещений. Голубые маркеры — цели. Золотой — лифт. Фиолетовый — необязательный сейф с элитной охраной и модулем.<br>Сначала выполните задачу, затем соберитесь у лифта. Живой напарник должен быть рядом. После палубы — модули, лечение и выбор следующего маршрута.</p></div><div class="helpbox"><h3>Вдвоём</h3><p>У каждого своя камера и управление. Рядом быстрее восстанавливаются щиты. Дружественного огня нет.<br>Раненого поднимают удержанием действия рядом 3 секунды; Биотех — быстрее. На спасение есть 40 секунд. Когда падают оба, повтор начинается с последнего шлюза.<br>Для сети нужен ПК с комплектным сервером. Оба телефона открывают его адрес; Python на телефоны ставить не нужно.</p></div><div class="helpbox"><h3>Компьютер и сложность</h3><p>WASD + мышь, ЛКМ — огонь. Пробел — рывок, Q — умение, E — действие, R — резонанс, F — перезарядка, Tab — карта, Esc — пауза.<br>«Бездна» включена по умолчанию. Для освоения управления есть «Ветеран» и «Исследователь». «Бездна» ускоряет врагов и делает попадания опаснее. У охотников растёт настойчивость по мере задержки на палубе.<br>Щиты не спасают от стояния на месте: двигайтесь, используйте укрытия, следите за предупреждениями.</p></div></div><div class="banner mt">Сохранение — в начале палубы и между палубами. Полное поражение не заставляет заново проходить всю кампанию. Сохранения старого «Гелиоса» не импортируются.</div>`}
